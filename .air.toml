[build]
  cmd = "go build -o ./tmp/digimap-backend ."
  bin = "./tmp/digimap-backend"
  full_bin = "./tmp/digimap-backend serve"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "migrations", "tests"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
