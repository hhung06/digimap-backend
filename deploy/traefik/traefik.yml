# Traefik v3 static configuration
# This file is bind-mounted read-only into the Traefik container.

api:
  dashboard: true

log:
  level: INFO
  format: json

accessLog:
  format: json

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    # swarmMode tells Traefik to watch Swarm services (not containers)
    swarmMode: true
    exposedByDefault: false
    # Only services on this network are eligible for routing
    network: traefik-public
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      # Use HTTP-01 challenge (simpler than DNS-01; requires port 80 open)
      httpChallenge:
        entryPoint: web
