services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      LOG_LEVEL: warn
      DB_SSLMODE: require
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  postgres:
    ports: []
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
