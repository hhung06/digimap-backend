services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - go-cache:/root/go/pkg/mod
    environment:
      APP_ENV: local
      DB_HOST: postgres
      REDIS_ADDR: redis:6379

  postgres:
    # pgvector/pgvector bundles the vector extension on top of the official postgres image
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: digimap
      POSTGRES_USER: digimap
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digimap -d digimap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://digimap:localpassword@postgres:5432/digimap?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  pg_data:
  redis_data:
  go-cache:
